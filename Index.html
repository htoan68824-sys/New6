
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-template-columns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành CSS Grid</h1>

    <section class="example">
        <h2>Ví dụ 1: Ba cột có kích thước bằng nhau</h2>

        <div class="grid-container grid-example-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>

    <section class="example">
        <h2>Ví dụ 2: Các cột có kích thước khác nhau</h2>

        <div class="grid-container grid-example-2">
            <div>Cột 1</div>
            <div>Cột 2</div>
            <div>Cột 3</div>
            <div>Cột 1</div>
            <div>Cột 2</div>
            <div>Cột 3</div>
        </div>
    </section>

</body>
</html>
